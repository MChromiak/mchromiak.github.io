<div id="aboutme">
    {% if AVATAR %}
        <p>
            <img width="180" height="180" class="img-thumbnail" src="{{ SITEURL }}/{{ AVATAR }}" alt="Portrait of {{ AUTHOR }}" loading="lazy" decoding="async"/>
        </p>
    {% endif %}
    {% if ABOUT_ME %}
    <p>
      <strong>{{ _('About') }} {{ AUTHOR }}</strong><br/>
        {{ ABOUT_ME }}
    </p>
    {% endif %}
</div>
