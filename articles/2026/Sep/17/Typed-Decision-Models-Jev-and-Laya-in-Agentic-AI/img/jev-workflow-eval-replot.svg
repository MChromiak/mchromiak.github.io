<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">TypeSafe workflow evaluation: mean reference agreement versus cost per case</title>
  <desc id="desc">An original replot of TypeSafe's vendor evaluation. Jev has 67.8 percent agreement at 0.0004 dollars per case. Several LLM workflows have similar or higher agreement at greater reported cost. Labels are derived from Astra and Fable model consensus, not human ground truth.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f3342" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="730" fill="#f7fafc"/>
  <text x="46" y="48" fill="#1f3342" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Vendor workflow eval: reference agreement versus cost</text>
  <text x="46" y="78" fill="#58707f" font-family="Inter, Arial, sans-serif" font-size="15">Mean across four TypeSafe-authored workflows · workflow implementations only · lower cost and higher agreement are better</text>

  <rect x="124" y="114" width="960" height="440" fill="#ffffff" stroke="#d3dfe5"/>
  <g stroke="#dce5ea" stroke-width="1">
    <path d="M124 554 H1084"/><path d="M124 444 H1084"/><path d="M124 334 H1084"/><path d="M124 224 H1084"/><path d="M124 114 H1084"/>
    <path d="M124 114 V554"/><path d="M364 114 V554"/><path d="M604 114 V554"/><path d="M844 114 V554"/><path d="M1084 114 V554"/>
  </g>
  <g fill="#58707f" font-family="Inter, Arial, sans-serif" font-size="13">
    <text x="106" y="559" text-anchor="end">40%</text>
    <text x="106" y="449" text-anchor="end">50%</text>
    <text x="106" y="339" text-anchor="end">60%</text>
    <text x="106" y="229" text-anchor="end">70%</text>
    <text x="106" y="119" text-anchor="end">80%</text>
    <text x="124" y="584" text-anchor="middle">$0.0001</text>
    <text x="364" y="584" text-anchor="middle">$0.001</text>
    <text x="604" y="584" text-anchor="middle">$0.01</text>
    <text x="844" y="584" text-anchor="middle">$0.10</text>
    <text x="1084" y="584" text-anchor="middle">$1.00</text>
    <text x="604" y="618" text-anchor="middle" font-size="15" font-weight="700">reported cost per workflow case, USD (log scale)</text>
    <text x="31" y="334" text-anchor="middle" font-size="15" font-weight="700" transform="rotate(-90 31 334)">agreement with model-derived reference</text>
  </g>

  <path d="M268 248 H707" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
  <text x="479" y="237" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="12">similar displayed agreement, different reported cost</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g>
      <circle cx="268" cy="248" r="13" fill="#c24397" stroke="#7f255f" stroke-width="2"/>
      <text x="285" y="238" fill="#7f255f" font-size="16" font-weight="800">Jev</text>
      <text x="285" y="257" fill="#58707f" font-size="12">67.8% · $0.0004</text>
    </g>
    <g>
      <circle cx="488" cy="259" r="10" fill="#2878a8"/><text x="501" y="278" fill="#1f3342" font-size="12">Luna · 66.8%</text>
    </g>
    <g>
      <circle cx="550" cy="285" r="10" fill="#7b8b93"/><text x="563" y="305" fill="#1f3342" font-size="12">DS v4 Flash · 64.4%</text>
    </g>
    <g>
      <circle cx="674" cy="404" r="10" fill="#d59a5f"/><text x="687" y="423" fill="#1f3342" font-size="12">Haiku 4.5 · 53.6%</text>
    </g>
    <g>
      <circle cx="720" cy="247" r="10" fill="#2878a8"/><text x="733" y="237" fill="#1f3342" font-size="12">Terra · 67.9%</text>
    </g>
    <g>
      <circle cx="752" cy="274" r="10" fill="#7b8b93"/><text x="765" y="294" fill="#1f3342" font-size="12">DS v4 Pro · 65.5%</text>
    </g>
    <g>
      <circle cx="826" cy="179" r="10" fill="#2878a8"/><text x="839" y="169" fill="#1f3342" font-size="12">Sol · 74.1%</text>
    </g>
    <g>
      <circle cx="862" cy="248" r="10" fill="#d59a5f"/><text x="875" y="267" fill="#1f3342" font-size="12">Sonnet 5 · 67.8%</text>
    </g>
    <g>
      <circle cx="905" cy="190" r="10" fill="#d59a5f"/><text x="918" y="181" fill="#1f3342" font-size="12">Opus 5 · 73.1%</text>
    </g>
  </g>

  <rect x="46" y="641" width="1108" height="54" rx="5" fill="#fff7ed" stroke="#d59a5f"/>
  <text x="65" y="663" fill="#8a4208" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Read this as vendor evidence, not an independent leaderboard.</text>
  <text x="65" y="683" fill="#1f3342" font-family="Inter, Arial, sans-serif" font-size="12">Reference labels average GPT-6 Astra and Claude Fable 5.1 at high thinking; the workflows were created by TypeSafe's model-capabilities team.</text>
  <a href="https://evals.typesafe.ai/">
    <text x="1154" y="718" text-anchor="end" fill="#2878a8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-decoration="underline">Data: TypeSafe AI workflow evals, accessed 2026-09-17</text>
  </a>
</svg>
